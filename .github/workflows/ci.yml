name: CI
on:
  push:
    branches:
      - '**'
      # The retired Stainless SaaS may still push this branch.
      - '!generated'
      # Generated previews; the pipeline that pushes them runs these checks.
      - '!stlc-preview/**'
  pull_request:

permissions:
  contents: read

jobs:
  # One job: runners bill each job by the started minute plus its own setup,
  # so lint, build and test share one checkout and one install.
  ci:
    timeout-minutes: 15
    name: lint, build and test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node for the mock server
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'

      - name: Bootstrap
        id: bootstrap
        run: ./scripts/bootstrap

      # Each check below runs even when an earlier one failed, so one run
      # reports every failure.
      - name: Run lints
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: ./scripts/lint

      - name: Run build
        id: build
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: uv build

      - name: Check installed packages
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./scripts/check-package

      - name: Run tests
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: ./scripts/test
